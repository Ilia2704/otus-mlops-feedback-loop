apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: mlops-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: airflow}
  template:
    metadata:
      labels: {app: airflow}
    spec:
      containers:
        - name: airflow
          image: apache/airflow:2.10.4-python3.11
          command: ["bash", "-c"]
          args:
            - >-
              airflow db migrate;
              airflow users create --username admin --password admin --firstname Demo --lastname User --role Admin --email demo@example.com || true;
              airflow scheduler & exec airflow webserver
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: SequentialExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: sqlite:////opt/airflow/airflow.db
          envFrom:
            - configMapRef: {name: demo-config}
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
      volumes:
        - name: dags
          configMap:
            name: airflow-dag
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: mlops-demo
spec:
  selector: {app: airflow}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
