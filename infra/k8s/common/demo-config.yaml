apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
  namespace: mlops-demo
data:
  MODEL_URL: http://titanic-model:8000
  DRIFTER_URL: http://drifter:8001
  DRIFT_CHECKER_URL: http://drift-checker:8002
  RETRAINER_URL: http://retrainer:8004
  MLFLOW_TRACKING_URI: http://mlflow:5000
  PROMETHEUS_URL: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: mlops-data
  REFERENCE_DATASET_KEY: reference/titanic_train.csv
  CURRENT_DATASET_PREFIX: current
  MODEL_ARTIFACT_PREFIX: model-artifacts

  # Главные ручки для лекции:
  REQUEST_INTERVAL_SECONDS: "1"
  DRIFT_STEP_PER_REQUEST: "0.002"
  DRIFT_MAX: "0.95"
  INVALID_RATE: "0.08"

  DRIFT_ROWS: "400"
  DRIFT_CHECK_CRON: "*/2 * * * *"
  CHECK_INTERVAL_SECONDS: "15"
  ACCURACY_THRESHOLD: "0.78"
  ACCURACY_WINDOW: "2m"
  BAD_CHECKS_BEFORE_RETRAIN: "2"
  RETRAIN_COOLDOWN_SECONDS: "120"
  RETRAIN_ROWS: "800"
  MODEL_REGISTRY_NAME: "titanic-survival-model"
  AUTO_PROMOTE_MODEL: "true"
  PROMOTION_MIN_ACCURACY: "0.80"
  PROMOTION_MIN_ROC_AUC: "0.85"
