apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-pvc
  namespace: mlops-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.17.2
          command: ["sh", "-c"]
          args:
            - >-
              mlflow server --host 0.0.0.0 --port 5000
              --backend-store-uri sqlite:////mlflow/mlflow.db
              --serve-artifacts --artifacts-destination /mlflow/artifacts
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: data
              mountPath: /mlflow
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops-demo
spec:
  selector: {app: mlflow}
  ports:
    - name: http
      port: 5000
      targetPort: 5000
