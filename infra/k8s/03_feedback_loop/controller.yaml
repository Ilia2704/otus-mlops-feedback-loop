apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-controller
  namespace: mlops-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: feedback-controller}
  template:
    metadata:
      labels: {app: feedback-controller}
    spec:
      containers:
        - name: app
          image: titanic-feedback-controller:demo
          imagePullPolicy: Never
          envFrom:
            - configMapRef: {name: demo-config}
          ports:
            - containerPort: 8003
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: feedback-controller
  namespace: mlops-demo
  labels:
    app: feedback-controller
    monitoring: prometheus
spec:
  selector: {app: feedback-controller}
  ports:
    - name: http
      port: 8003
      targetPort: 8003
